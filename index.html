<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Unity Web Player | Roguelite</title>
    <link rel="shortcut icon" href="TemplateData/Roguelite.png">
    <link rel="icon" type="image/png" href="TemplateData/Roguelite.png">
    
    <link rel="stylesheet" href="TemplateData/style.css"> 

    <style>
      /* 強制讓網頁滿版且不出現捲軸 */
      html, body { 
        background-color: #000;
        margin: 0;
        padding: 0;
        overflow: hidden; /* 防止出現網頁捲軸 */
        display: flex;
        justify-content: center;
        align-items: center;
        /* 使用 --vh 修正手機瀏覽器網址列導致 100vh 跑版的問題 */
        height: calc(var(--vh, 1vh) * 100);
        width: 100vw;
      }
      
      /* 容器與畫布填滿視窗 */
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* 核心修正：利用 contain 確保不管橫向或直向，都不會超出螢幕被裁切 */
      #unity-canvas {
          width: 100% !important;
          height: 100% !important; 
          max-width: 100% !important;
          max-height: 100% !important;
          aspect-ratio: 16 / 9 !important; 
          object-fit: contain !important; 
          background: #000;

          image-rendering: -moz-crisp-edges;    /* Firefox */
          image-rendering: -webkit-crisp-edges; /* Safari */
          image-rendering: pixelated;           /* Chrome / Edge / Opera */
      }

      /* 行動端的 Canvas 繼承同樣的防裁切邏輯 */
      #unity-container.unity-mobile #unity-canvas {
          width: 100% !important;
          height: 100% !important;
          max-width: 100% !important;
          max-height: 100% !important;
          aspect-ratio: 16 / 9 !important;
          object-fit: contain !important;
      }

      /* 隱藏底部的工具欄 (包含按鈕與標題) */
      #unity-footer { display: none !important; }
      
      /* 讓載入條與 Logo 居中 */
      #unity-loading-bar { 
        position: absolute; 
        left: 50%; 
        top: 50%; 
        transform: translate(-50%, -50%); 
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <script>
      // --- 修正手機動態高度 (網址列與工具欄) ---
      function resetHeight() {
        // 將實際可視高度除以 100，存入 CSS 變數 --vh
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      window.addEventListener('resize', resetHeight);
      window.addEventListener('orientationchange', resetHeight);
      resetHeight(); // 初始化執行
      // ----------------------------------------

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Roguelite_Game.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Roguelite_Game.data",
        frameworkUrl: buildUrl + "/Roguelite_Game.framework.js",
        codeUrl: buildUrl + "/Roguelite_Game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Roguelite",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // 檢查行動裝置
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        // 高 DPI (Retina) 模糊修復
        const dpr = window.devicePixelRatio || 1;
        
        // 取得你在 Unity 設定的預設寬高
        const baseWidth = 1280;
        const baseHeight = 720;
        
        // 讓 Canvas 的實體渲染像素乘上 DPR（例如 1280 * 2 = 2560）
        canvas.width = baseWidth * dpr;
        canvas.height = baseHeight * dpr;
        
        // 移除原本 JS 寫死的 style.width = "100%" / height = "auto"，全部交給 CSS 處理更穩定

        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
